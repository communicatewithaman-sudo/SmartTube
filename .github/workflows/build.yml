name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # SmartTube README: JDK 14 or older is required
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo mkdir -p "$SDK/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$SDK/licenses/android-sdk-license" > /dev/null
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$SDK/licenses/android-sdk-preview-license" > /dev/null

      - name: Gradle memory
        run: echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleStstableDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          grep -n -A25 "What went wrong" build.log | head -60
          grep -n "Caused by" build.log | head -15

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
